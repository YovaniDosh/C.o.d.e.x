<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TaskFlow Pro | Gestor de Tareas</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="container">

        <!-- ==========================
             HEADER
        =========================== -->

        <header>

            <h1>TaskFlow Pro</h1>

            <p>
                Organiza tu día de manera más sencilla.
            </p>

        </header>

        <!-- ==========================
             FORMULARIO
        =========================== -->

        <section class="task-form">

            <input
                id="taskInput"
                type="text"
                placeholder="Nueva tarea..."
            >

            <select id="prioritySelect">

                <option value="high">
                    Alta
                </option>

                <option value="medium" selected>
                    Media
                </option>

                <option value="low">
                    Baja
                </option>

            </select>

            <input
                id="dateInput"
                type="date"
            >

            <button id="addTaskButton">

                Agregar

            </button>

        </section>

        <!-- ==========================
             BUSCADOR
        =========================== -->

        <section class="search-container">

            <input
                id="searchInput"
                type="text"
                placeholder="Buscar tareas..."
            >

        </section>

        <!-- ==========================
             FILTROS
        =========================== -->

        <section class="filters">

            <button
                class="filter-button active"
                data-filter="all">

                Todas

            </button>

            <button
                class="filter-button"
                data-filter="pending">

                Pendientes

            </button>

            <button
                class="filter-button"
                data-filter="completed">

                Completadas

            </button>

        </section>

        <!-- ==========================
             LISTA DE TAREAS
        =========================== -->

        <section>

            <ul id="taskList">

            </ul>

        </section>

        <!-- ==========================
             CONTADOR
        =========================== -->

        <footer>

            <p id="taskCounter">

                0 tareas

            </p>

        </footer>

    </main>

    <script
        type="module"
        src="js/app.js">
    </script>

</body>

</html>
