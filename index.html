<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Gestor de Tareas </title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="search-container">
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Buscar tareas...">
    </div>
    <div class="filters">
        <button class="filter-button active" data-filter="all">Todas</button>
        <button class="filter-button" data-filter="pending">Pendientes</button>
        <button class="filter-button" data-filter="completed">Completadas</button>
    </div>
    <main class="container">

        <header>

            <h1>TaskFlow Pro</h1>

            <p>
                Organiza tu día de manera más encilla.
            </p>

        </header>

        <!-- Formulario -->
        <div class="task-form">

    <input
        id="taskInput"
        type="text"
        placeholder="Nueva tarea..."
    >


    <select id="prioritySelect">

        <option value="high">
            Alta
        </option>

        <option value="medium" selected>
            Media
        </option>

        <option value="low">
            Baja
        </option>

    </select>


    <button id="addTaskButton">
        Agregar
    </button>

</div>

        <!-- Buscador -->
        <section class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar por nombre...">

        </section>

        <!-- Filtros -->
        <section class="filters">

            <button class="filter active">

                Todas

            </button>

            <button class="filter">

                Pendientes

            </button>

            <button class="filter">

                Completadas

            </button>

        </section>

        <!-- Lista de tareas -->
        <section>

            <ul id="taskList">

            </ul>

        </section>

        <!-- Información -->
        <footer>

            <p id="taskCounter">

                0 tareas

            </p>

        </footer>

    </main>

    <!-- JavaScript -->
    <script type="module" src="js/app.js"></script>

</body>

</html>
