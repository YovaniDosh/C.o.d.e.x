<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TaskFlow Pro | Gestor de Tareas</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="container">

        <!-- ==========================
             HEADER
        =========================== -->

        <header>

            <h1>TaskFlow Pro</h1>

            <p>
                Organiza tu día de manera más sencilla.
            </p>

            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar tema oscuro" aria-pressed="false">
                🌙
            </button>

        </header>

        <!-- ==========================
             FORMULARIO
        =========================== -->

        <section class="task-form" aria-labelledby="taskFormTitle">
            <h2
                id="taskFormTitle"
                class="sr-only">
                Crear nueva tarea
            </h2>

            <label
                for="taskInput"
                class="sr-only">
                Nombre de la tarea
            </label>

            <input
                id="taskInput"
                type="text"
                placeholder="Nueva tarea..."
                maxlength="120"
                autocomplete="off">

            <label
                for="prioritySelect"
                class="sr-only">
                Prioridad
            </label>

            <select id="prioritySelect">
                <option value="high">
                    Alta
                </option>

                <option
                    value="medium"
                    selected>
                    Media
                </option>

                <option value="low">
                    Baja
                </option>
            </select>

            <label
                for="dateInput"
                class="sr-only">
                Fecha límite
            </label>

            <input
                id="dateInput"
                type="date">

            <button
                id="addTaskButton"
                type="button">
                Agregar
            </button>
        </section>

        <!-- ==========================
             BUSCADOR
        =========================== -->

        <section
            class="search-container"
            aria-labelledby="searchTitle">
            <h2
                id="searchTitle"
                class="sr-only">
                Buscar tareas
            </h2>

            <label
                for="searchInput"
                class="sr-only">
                Buscar por nombre
            </label>

            <input
                id="searchInput"
                type="search"
                placeholder="Buscar tareas..."
                autocomplete="off">
        </section>

        <!-- ==========================
             FILTROS
        =========================== -->

        <section
            class="filters"
            aria-labelledby="filtersTitle">
            <h2
                id="filtersTitle"
                class="sr-only">
                Filtrar tareas
            </h2>

            <button
                class="filter-button active"
                type="button"
                data-filter="all"
                aria-pressed="true">
                Todas
            </button>

            <button
                class="filter-button"
                type="button"
                data-filter="pending"
                aria-pressed="false">
                Pendientes
            </button>

            <button
                class="filter-button"
                type="button"
                data-filter="completed"
                aria-pressed="false">
                Completadas
            </button>
        </section>

        <!-- ==========================
                 ORDENAMIENTO
        =========================== -->

        <section class="sort-container" aria-labelledby="sortTitle">
        <h2
            id="sortTitle"
            class="sr-only">
            Ordenar tareas
        </h2>

        <label for="sortSelect">
            Ordenar por:
        </label>

        <select id="sortSelect">
            <option value="default">
                Orden original
            </option>

            <option value="name">
                Nombre
            </option>

            <option value="priority">
                Prioridad
            </option>

            <option value="date">
                Fecha límite
            </option>
        </select>
        </section>

        <!-- ==========================
             LISTA DE TAREAS
        =========================== -->

        <section aria-labelledby="taskListTitle">
            <h2 id="taskListTitle" class="sr-only">
                Lista de tareas
            </h2>

            <ul id="taskList" aria-live="polite" aria-relevant="additions removals"></ul>
        </section>

        <!-- ==========================
             CONTADOR
        =========================== -->

        <footer>

            <p id="taskCounter">

                0 tareas

            </p>
            <section class="stats" aria-labelledby="statsTitle">

                <h2 id="statsTitle">
                    📊 Estadísticas
                </h2>

                <div id="statsContainer"></div>
            </section>

        </footer>

    </main>

    <div
        id="deleteModal"
        class="modal"
        aria-hidden="true"
    >
        <div
            class="modal-overlay"
            data-close-edit-modal
            aria-hidden="true"
        ></div>

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="deleteModalTitle"
        >
            <h2 id="deleteModalTitle">
                Eliminar tarea
            </h2>

            <p id="deleteModalMessage">
                ¿Deseas eliminar esta tarea?
            </p>

            <div class="modal-actions">

                <button
                    id="cancelDeleteButton"
                    type="button"
                    class="secondary-button"
                >
                    Cancelar
                </button>

                <button
                    id="confirmDeleteButton"
                    type="button"
                    class="danger-button"
                >
                    Eliminar
                </button>

            </div>
        </div>
    </div>

    <div
        id="editModal"
        class="modal"
        aria-hidden="true"
        hidden>

        <div
            class="modal-overlay"
            data-close-edit-modal
            aria-hidden="true">
       </div>

        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="editModalTitle" aria-describedby="editModalDescription">

            <h2
                id="editModalTitle"
                class="modal__title"
            >
                Editar tarea
            </h2>

            <p
                id="editModalDescription"
                class="modal__description"
            >
                Modifica el contenido de la tarea seleccionada.
            </p>

            <form id="editTaskForm">

                <label
                    for="editTaskInput"
                    class="modal__label"
                >
                    Nombre de la tarea
                </label>

                <input
                    id="editTaskInput"
                    class="modal__input"
                    type="text"
                    maxlength="120"
                    autocomplete="off"
                    required
                >

                <div class="modal-actions">

                    <button
                        id="cancelEditButton"
                        class="secondary-button"
                        type="button"
                    >
                        Cancelar
                    </button>

                    <button
                        id="saveEditButton"
                        class="primary-button"
                        type="submit"
                    >
                        Guardar cambios
                    </button>

                </div>

            </form>

        </div>
    </div>

    <div id="toastContainer" aria-live="polite" aria-atomic="false" class="toast-container">

    </div>

    <script
        type="module"
        src="js/app.js">
    </script>

</body>

</html>
